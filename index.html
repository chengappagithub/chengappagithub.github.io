<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Year Google Calendar View</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calendar-frame {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .calendar-header {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 16px 24px;
            text-align: center;
        }

        .calendar-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .iframe-container {
            width: 100%;
            height: 750px;
            border: none;
        }

        .responsive-iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="calendar-frame">
        <div class="calendar-header">
            <h1>Academic & Event Calendar — Full Year View</h1>
        </div>
        <div class="iframe-container">
            <!-- Full Year Google Calendar Embed -->
            <iframe 
                class="responsive-iframe"
                src="https://calendar.google.com/calendar/embed?mode=AGENDA&amp;dates=20260101%2F20261231&amp;src=ph26resch14001%40iith.ac.in&amp;ctz=Asia%2FKolkata" 
                frameborder="0" 
                scrolling="yes">
            </iframe>
        </div>
    </div>

</body>
</html>
